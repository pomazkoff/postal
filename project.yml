# XcodeGen-спека. Генерация: `brew install xcodegen && xcodegen generate`
# (перезапишет Postman.xcodeproj; эквивалентный проект без XcodeGen — python3 tools/gen_xcodeproj.py).
# Название, bundle id и версии — в Postman/Config/App.xcconfig.
name: Postman
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
targets:
  Postman:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Postman/Config/App.xcconfig
      Release: Postman/Config/App.xcconfig
    sources:
      - path: Postman
        excludes:
          - GameAssets
          - GameAssets/**
          - Info.plist
      # Синяя папка (folder reference): копируется в бандл как есть -> Bundle.main/GameAssets/...
      - path: Postman/GameAssets
        type: folder
        buildPhase: resources
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Postman/Postman.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Postman/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Почтальон идёт, когда идёте вы: игра читает количество шагов из приложения «Здоровье», чтобы двигать героя по дороге. Данные не покидают устройство."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Игра ничего не записывает в «Здоровье»."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Примерное место нужно только для погоды в Долине: если у вас дождь или снег, он пойдёт и у почтальона. Точные координаты не используются и никуда не сохраняются."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Postman:
    build:
      targets:
        Postman: all
    run:
      config: Debug
    archive:
      config: Release
